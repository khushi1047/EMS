<h2>Employees</h2>

<button routerLink="/add-employee">Add Employee</button>

<table border="1">

  <thead>
    <tr>
      <th>ID</th>
      <th>Code</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Department</th>
      <th>Designation</th>
      <th>Salary</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>

    @for (emp of employees; track emp.id) {
      <tr>
        <td>{{ emp.id }}</td>
        <td>{{ emp.employee_code }}</td>
        <td>{{ emp.name }}</td>
        <td>{{ emp.email }}</td>
        <td>{{ emp.phone }}</td>
        <td>{{ emp.department }}</td>
        <td>{{ emp.designation }}</td>
        <td>{{ emp.salary }}</td>

        <td>
          <button (click)="edit(emp.id)">Edit</button>
          <button (click)="delete(emp.id)">Delete</button>
        </td>
      </tr>
    }

  </tbody>

</table>
